spring:
  application:
    name: market-shop
  datasource:
    url: ${MARKET_SHOP_DB_URL:jdbc:mysql://127.0.0.1:3308/market_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MARKET_SHOP_DB_USER:market_shop}
    password: ${MARKET_SHOP_DB_PASSWORD:market_shop_dev}
    hikari:
      maximum-pool-size: ${MARKET_SHOP_DB_POOL_SIZE:10}
      minimum-idle: 2
  data:
    redis:
      host: ${MARKET_SHOP_REDIS_HOST:127.0.0.1}
      port: ${MARKET_SHOP_REDIS_PORT:6380}
      password: ${MARKET_SHOP_REDIS_PASSWORD:}
      database: ${MARKET_SHOP_REDIS_DATABASE:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: ${MARKET_SHOP_MAX_PROOF_SIZE:8MB}
      max-request-size: ${MARKET_SHOP_MAX_PROOF_REQUEST_SIZE:24MB}
  jackson:
    time-zone: Asia/Hong_Kong

server:
  port: ${MARKET_SHOP_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    print-banner: false

sa-token:
  token-name: market-shop-token
  timeout: 2592000
  active-timeout: 7200
  is-concurrent: false
  is-share: false
  token-style: tik
  is-log: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

market-shop:
  safety:
    online-payment-enabled: false
    cash-withdrawal-enabled: false
    points-cash-equivalent: false
    max-reward-depth: 1
  object-storage:
    provider: ${MARKET_SHOP_STORAGE_PROVIDER:s3}
    endpoint: ${MARKET_SHOP_RUSTFS_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MARKET_SHOP_RUSTFS_ACCESS_KEY:marketshop}
    secret-key: ${MARKET_SHOP_RUSTFS_SECRET_KEY:marketshop_dev_secret}
    bucket: ${MARKET_SHOP_RUSTFS_BUCKET:market-shop-private}
    region: ${MARKET_SHOP_RUSTFS_REGION:us-east-1}
    signed-url-minutes: ${MARKET_SHOP_SIGNED_URL_MINUTES:5}
    local:
      root: ${MARKET_SHOP_LOCAL_STORAGE_ROOT:./data/uploads}
      signing-secret: ${MARKET_SHOP_LOCAL_STORAGE_SIGNING_SECRET:}
      private-base-url: ${MARKET_SHOP_LOCAL_STORAGE_PRIVATE_BASE_URL:/api/v1/storage/private}
  bootstrap-admin:
    enabled: ${MARKET_SHOP_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${MARKET_SHOP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${MARKET_SHOP_BOOTSTRAP_ADMIN_PASSWORD:}
    invite-code: ${MARKET_SHOP_BOOTSTRAP_INVITE_CODE:BOOTSTRAP2026}
  wechat:
    enabled: ${MARKET_SHOP_WECHAT_ENABLED:false}
    mock-enabled: ${MARKET_SHOP_WECHAT_MOCK_ENABLED:false}
    official-account-app-id: ${MARKET_SHOP_WECHAT_OA_APP_ID:}
    official-account-secret: ${MARKET_SHOP_WECHAT_OA_SECRET:}
    website-app-id: ${MARKET_SHOP_WECHAT_WEB_APP_ID:}
    website-secret: ${MARKET_SHOP_WECHAT_WEB_SECRET:}
    oauth-callback-base-url: ${MARKET_SHOP_WECHAT_CALLBACK_BASE_URL:http://localhost:8080}
