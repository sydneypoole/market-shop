spring:
  application:
    name: market-shop
  output:
    ansi:
      enabled: ${MARKET_SHOP_LOG_ANSI:ALWAYS}
  datasource:
    url: ${MARKET_SHOP_DB_URL:jdbc:mysql://127.0.0.1:3308/market_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MARKET_SHOP_DB_USER:market_shop}
    password: ${MARKET_SHOP_DB_PASSWORD:market_shop_dev}
    hikari:
      maximum-pool-size: ${MARKET_SHOP_DB_POOL_SIZE:10}
      minimum-idle: 2
      # Readiness must fail closed before the public Nginx health proxy times out.
      # These limits also prevent callers from waiting on a dead database for
      # Hikari's 30-second default connection timeout.
      connection-timeout: ${MARKET_SHOP_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${MARKET_SHOP_DB_VALIDATION_TIMEOUT_MS:2000}
  data:
    redis:
      host: ${MARKET_SHOP_REDIS_HOST:127.0.0.1}
      port: ${MARKET_SHOP_REDIS_PORT:6380}
      password: ${MARKET_SHOP_REDIS_PASSWORD:}
      database: ${MARKET_SHOP_REDIS_DATABASE:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: ${MARKET_SHOP_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MARKET_SHOP_MAX_PROOF_REQUEST_SIZE:24MB}
  jackson:
    time-zone: Asia/Hong_Kong

server:
  port: ${MARKET_SHOP_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    print-banner: false

sa-token:
  token-name: market-shop-token
  timeout: 2592000
  active-timeout: 7200
  is-concurrent: false
  is-share: false
  token-style: tik
  is-log: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db,redis,objectStorage
          show-details: never

logging:
  level:
    root: ${MARKET_SHOP_LOG_LEVEL:INFO}
    com.marketshop: ${MARKET_SHOP_APP_LOG_LEVEL:INFO}
  charset:
    console: UTF-8
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([market-shop]){magenta} %clr([%thread]){blue} %clr(%logger{40}){cyan} - %msg%n%wEx"

market-shop:
  jobs:
    auto-receive-delay-ms: ${MARKET_SHOP_AUTO_RECEIVE_DELAY_MS:60000}
    aftersale-timeout-delay-ms: ${MARKET_SHOP_AFTERSALE_TIMEOUT_DELAY_MS:300000}
    order-timeout-delay-ms: ${MARKET_SHOP_ORDER_TIMEOUT_DELAY_MS:300000}
  s3-backend-mode: ${MARKET_SHOP_S3_BACKEND_MODE:external}
  identity:
    avatar-max-size-bytes: ${MARKET_SHOP_MEMBER_AVATAR_MAX_SIZE_BYTES:5242880}
  security:
    secure-cookie: ${MARKET_SHOP_COOKIE_SECURE:false}
  scheduling:
    enabled: ${MARKET_SHOP_SCHEDULING_ENABLED:true}
  safety:
    online-payment-enabled: false
    cash-withdrawal-enabled: false
    points-cash-equivalent: false
    max-reward-depth: 1
  object-storage:
    provider: ${MARKET_SHOP_STORAGE_PROVIDER:s3}
    create-bucket: ${MARKET_SHOP_STORAGE_CREATE_BUCKET:false}
    endpoint: ${MARKET_SHOP_RUSTFS_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MARKET_SHOP_RUSTFS_ACCESS_KEY:marketshop}
    secret-key: ${MARKET_SHOP_RUSTFS_SECRET_KEY:marketshop_dev_secret}
    bucket: ${MARKET_SHOP_RUSTFS_BUCKET:market-shop-private}
    region: ${MARKET_SHOP_RUSTFS_REGION:us-east-1}
    signed-url-minutes: ${MARKET_SHOP_SIGNED_URL_MINUTES:5}
    # Non-zero seconds override is reserved for short-lived integration drills.
    signed-url-seconds: ${MARKET_SHOP_SIGNED_URL_SECONDS:0}
    # Readiness probes must return before the public Nginx health timeout when
    # an external S3 endpoint is black-holed.
    health-timeout-seconds: ${MARKET_SHOP_OBJECT_STORAGE_HEALTH_TIMEOUT_SECONDS:4}
    api-timeout-seconds: ${MARKET_SHOP_OBJECT_STORAGE_API_TIMEOUT_SECONDS:15}
    local:
      root: ${MARKET_SHOP_LOCAL_STORAGE_ROOT:./data/uploads}
      signing-secret: ${MARKET_SHOP_LOCAL_STORAGE_SIGNING_SECRET:}
      private-base-url: ${MARKET_SHOP_LOCAL_STORAGE_PRIVATE_BASE_URL:/api/v1/storage/private}
  bootstrap-admin:
    enabled: ${MARKET_SHOP_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${MARKET_SHOP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${MARKET_SHOP_BOOTSTRAP_ADMIN_PASSWORD:}
    invite-code: ${MARKET_SHOP_BOOTSTRAP_INVITE_CODE:BOOTSTRAP2026}
    sponsor-claim-secret: ${MARKET_SHOP_BOOTSTRAP_SPONSOR_CLAIM_SECRET:}
  wechat:
    enabled: ${MARKET_SHOP_WECHAT_ENABLED:false}
    mock-enabled: ${MARKET_SHOP_WECHAT_MOCK_ENABLED:false}
    miniprogram-app-id: ${MARKET_SHOP_WECHAT_MINIPROGRAM_APP_ID:}
    miniprogram-secret: ${MARKET_SHOP_WECHAT_MINIPROGRAM_SECRET:}
