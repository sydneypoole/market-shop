market-shop:
  security:
    secure-cookie: false
    # Vite dev servers proxy API writes from these browser origins to the
    # local backend. Keep this explicit; production defaults to no extras.
    additional-write-origins: ${MARKET_SHOP_ADDITIONAL_WRITE_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  wechat:
    mock-enabled: true
