services:
  app:
    # 本地覆盖使用源码构建镜像，并显式切换到 local 配置；生产基础编排不会自动构建。
    image: market-shop:local
    build:
      # 使用仓库根目录作为 Docker 构建上下文。
      context: .
      # 复用与生产相同的单镜像 Dockerfile，保证本地验证和发布产物一致。
      dockerfile: Dockerfile
    environment:
      # 本地允许 HTTP Cookie，便于浏览器直接访问 127.0.0.1。
      SPRING_PROFILES_ACTIVE: local
      MARKET_SHOP_COOKIE_SECURE: "false"
      # 仅本地开启模拟微信登录，生产配置会在启动前拒绝该开关。
      MARKET_SHOP_WECHAT_MOCK_ENABLED: "true"
      # 本地保留定时任务，便于验证自动收货、Outbox 和凭证清理。
      MARKET_SHOP_SCHEDULING_ENABLED: "true"
      # 本地 RustFS/开发环境允许按需自动创建 Bucket。
      MARKET_SHOP_STORAGE_CREATE_BUCKET: "true"

  mysql:
    # 仅绑定本机回环地址，避免开发数据库暴露到局域网或公网。
    ports:
      - "127.0.0.1:${MARKET_SHOP_DB_PORT:-3308}:3306"

  redis:
    # 仅绑定本机回环地址，避免开发 Redis 被外部访问。
    ports:
      - "127.0.0.1:${MARKET_SHOP_REDIS_PORT:-6380}:6379"
