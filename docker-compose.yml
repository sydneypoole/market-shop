name: market-shop

services:
  app:
    # 生产默认只接受不可变 digest；本地构建由 docker-compose.local.yml 显式覆盖。
    image: ${MARKET_SHOP_IMAGE:?MARKET_SHOP_IMAGE must be an immutable image digest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
        required: false
    environment:
      # 默认必须是 prod；local/mock 只能通过开发覆盖文件显式启用。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 生产 Cookie 必须开启 Secure，应用的生产校验会拒绝 false。
      MARKET_SHOP_COOKIE_SECURE: ${MARKET_SHOP_COOKIE_SECURE:-true}
      # 可选的跨站写请求来源白名单（生产环境只允许 HTTPS 来源）。
      MARKET_SHOP_ADDITIONAL_WRITE_ORIGINS: ${MARKET_SHOP_ADDITIONAL_WRITE_ORIGINS:-}
      # 候选镜像预检时可关闭定时任务，正式实例默认开启。
      MARKET_SHOP_SCHEDULING_ENABLED: ${MARKET_SHOP_SCHEDULING_ENABLED:-true}
      # Outbox 扫描间隔（毫秒），生产默认与代码一致为 5 秒。
      MARKET_SHOP_JOBS_OUTBOX_DELAY_MS: ${MARKET_SHOP_JOBS_OUTBOX_DELAY_MS:-5000}
      # 单个事件进入死信前的最大尝试次数。
      MARKET_SHOP_JOBS_OUTBOX_MAX_ATTEMPTS: ${MARKET_SHOP_JOBS_OUTBOX_MAX_ATTEMPTS:-5}
      # 首次重试的基础退避秒数。
      MARKET_SHOP_JOBS_OUTBOX_BASE_DELAY_SECONDS: ${MARKET_SHOP_JOBS_OUTBOX_BASE_DELAY_SECONDS:-5}
      # 指数退避上限（秒），用于约束恢复和告警窗口。
      MARKET_SHOP_JOBS_OUTBOX_MAX_DELAY_SECONDS: ${MARKET_SHOP_JOBS_OUTBOX_MAX_DELAY_SECONDS:-3600}
      # Spring Boot 控制台是否输出 ANSI 彩色日志；日志平台不支持颜色时设为 NEVER。
      MARKET_SHOP_LOG_ANSI: ${MARKET_SHOP_LOG_ANSI:-ALWAYS}
      # 全局日志级别；生产环境建议保持 INFO。
      MARKET_SHOP_LOG_LEVEL: ${MARKET_SHOP_LOG_LEVEL:-INFO}
      # 商城业务代码日志级别，可独立调整而不放大全部框架日志。
      MARKET_SHOP_APP_LOG_LEVEL: ${MARKET_SHOP_APP_LOG_LEVEL:-INFO}
      # MySQL JDBC 地址；容器内通过 mysql 服务名访问数据库。
      MARKET_SHOP_DB_URL: jdbc:mysql://mysql:3306/${MARKET_SHOP_DB_NAME:-market_shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false&allowPublicKeyRetrieval=true
      # 商城业务数据库用户名。
      MARKET_SHOP_DB_USER: ${MARKET_SHOP_DB_USER:-market_shop}
      # 商城业务数据库密码；必须通过 .env 显式配置。
      MARKET_SHOP_DB_PASSWORD: ${MARKET_SHOP_DB_PASSWORD:?MARKET_SHOP_DB_PASSWORD is required}
      # Redis 服务主机名；使用 Compose 内部服务名。
      MARKET_SHOP_REDIS_HOST: redis
      # Redis 容器内部端口。
      MARKET_SHOP_REDIS_PORT: "6379"
      # Redis 访问密码；必须通过 .env 显式配置。
      MARKET_SHOP_REDIS_PASSWORD: ${MARKET_SHOP_REDIS_PASSWORD:?MARKET_SHOP_REDIS_PASSWORD is required}
      MARKET_SHOP_REDIS_DATABASE: ${MARKET_SHOP_REDIS_DATABASE:-0}
      # 图片存储类型：local 表示本地持久卷，s3 表示 RustFS 或其他 S3 兼容服务。
      MARKET_SHOP_STORAGE_PROVIDER: ${MARKET_SHOP_STORAGE_PROVIDER:-local}
      # S3 对象来源：external 走对象备份 hook；bundled 仅供 local/e2e
      # RustFS fixture，prod profile 会在启动前 fail-fast 拒绝 bundled。
      MARKET_SHOP_S3_BACKEND_MODE: ${MARKET_SHOP_S3_BACKEND_MODE:-external}
      # 生产默认要求预置 bucket；仅本地 RustFS 初始化显式开启建桶。
      MARKET_SHOP_STORAGE_CREATE_BUCKET: ${MARKET_SHOP_STORAGE_CREATE_BUCKET:-false}
      # 本地存储在应用容器内的根目录，与下方持久卷挂载路径保持一致。
      MARKET_SHOP_LOCAL_STORAGE_ROOT: /opt/market-shop/data/uploads
      # 本地私密凭证链接的 HMAC 签名密钥；local 模式要求至少 32 位。
      MARKET_SHOP_LOCAL_STORAGE_SIGNING_SECRET: ${MARKET_SHOP_LOCAL_STORAGE_SIGNING_SECRET:-}
      # 本地私密凭证短时签名链接的应用访问路径。
      MARKET_SHOP_LOCAL_STORAGE_PRIVATE_BASE_URL: ${MARKET_SHOP_LOCAL_STORAGE_PRIVATE_BASE_URL:-/api/v1/storage/private}
      # 付款凭证签名链接有效期；E2E 覆盖层会缩短为数秒，真实验证过期和
      # 删除后重新签名的控制器行为，而不是只做源码断言。
      MARKET_SHOP_SIGNED_URL_MINUTES: ${MARKET_SHOP_SIGNED_URL_MINUTES:-5}
      MARKET_SHOP_SIGNED_URL_SECONDS: ${MARKET_SHOP_SIGNED_URL_SECONDS:-0}
      MARKET_SHOP_OBJECT_STORAGE_HEALTH_TIMEOUT_SECONDS: ${MARKET_SHOP_OBJECT_STORAGE_HEALTH_TIMEOUT_SECONDS:-4}
      MARKET_SHOP_OBJECT_STORAGE_API_TIMEOUT_SECONDS: ${MARKET_SHOP_OBJECT_STORAGE_API_TIMEOUT_SECONDS:-15}
      # S3/RustFS API 地址；rustfs.localhost 可同时被 Compose 网络和宿主机浏览器访问。
      MARKET_SHOP_RUSTFS_ENDPOINT: ${MARKET_SHOP_RUSTFS_ENDPOINT:-}
      # S3/RustFS Access Key。
      MARKET_SHOP_RUSTFS_ACCESS_KEY: ${MARKET_SHOP_RUSTFS_ACCESS_KEY:-}
      # S3/RustFS Secret Key；启用 s3 模式时必须配置强密钥。
      MARKET_SHOP_RUSTFS_SECRET_KEY: ${MARKET_SHOP_RUSTFS_SECRET_KEY:-}
      # 商品图片和私密凭证使用的 S3/RustFS 私有 Bucket 名称。
      MARKET_SHOP_RUSTFS_BUCKET: ${MARKET_SHOP_RUSTFS_BUCKET:-market-shop-private}
      # S3 签名区域；RustFS 本地部署默认使用 us-east-1。
      MARKET_SHOP_RUSTFS_REGION: ${MARKET_SHOP_RUSTFS_REGION:-us-east-1}
      # 是否执行首次后台账号初始化；初始化成功后应立即改回 false。
      MARKET_SHOP_BOOTSTRAP_ADMIN_ENABLED: ${MARKET_SHOP_BOOTSTRAP_ADMIN_ENABLED:-false}
      # 首次初始化创建的超级管理员用户名。
      MARKET_SHOP_BOOTSTRAP_ADMIN_USERNAME: ${MARKET_SHOP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      # 首次初始化后台账号使用的临时强密码；首次登录后必须修改。
      MARKET_SHOP_BOOTSTRAP_ADMIN_PASSWORD: ${MARKET_SHOP_BOOTSTRAP_ADMIN_PASSWORD:-}
      # 首个超级会员的邀请码，用于本地演示会员注册。
      MARKET_SHOP_BOOTSTRAP_INVITE_CODE: ${MARKET_SHOP_BOOTSTRAP_INVITE_CODE:-}
      # 仅用于首个真实微信账号一次性认领 Bootstrap Sponsor；严禁记录或放入 URL。
      MARKET_SHOP_BOOTSTRAP_SPONSOR_CLAIM_SECRET: ${MARKET_SHOP_BOOTSTRAP_SPONSOR_CLAIM_SECRET:-}
      # 是否启用真实微信 OAuth；本地演示默认关闭。
      MARKET_SHOP_WECHAT_ENABLED: ${MARKET_SHOP_WECHAT_ENABLED:-false}
      # 模拟登录在生产始终显式关闭，启动校验会拒绝 true。
      MARKET_SHOP_WECHAT_MOCK_ENABLED: ${MARKET_SHOP_WECHAT_MOCK_ENABLED:-false}
      # 微信公众号 AppID，用于微信内 H5 授权。
      MARKET_SHOP_WECHAT_OA_APP_ID: ${MARKET_SHOP_WECHAT_OA_APP_ID:-}
      # 微信公众号 AppSecret，仅允许在服务端运行环境中配置。
      MARKET_SHOP_WECHAT_OA_SECRET: ${MARKET_SHOP_WECHAT_OA_SECRET:-}
      # 微信开放平台网站应用 AppID，用于电脑端扫码登录。
      MARKET_SHOP_WECHAT_WEB_APP_ID: ${MARKET_SHOP_WECHAT_WEB_APP_ID:-}
      # 微信开放平台网站应用 AppSecret，仅允许在服务端运行环境中配置。
      MARKET_SHOP_WECHAT_WEB_SECRET: ${MARKET_SHOP_WECHAT_WEB_SECRET:-}
      # 微信 OAuth 回调使用的商城外部访问根地址。
      MARKET_SHOP_WECHAT_CALLBACK_BASE_URL: ${MARKET_SHOP_WECHAT_CALLBACK_BASE_URL:-}
      # 微信 OAuth 回跳允许的独立商城前端来源。
      MARKET_SHOP_STOREFRONT_BASE_URL: ${MARKET_SHOP_STOREFRONT_BASE_URL:-}
    ports:
      # 商城统一入口：宿主机绑定地址、宿主机端口、容器 Nginx 端口。
      - "${MARKET_SHOP_HTTP_BIND_HOST:-127.0.0.1}:${MARKET_SHOP_HTTP_PORT:-8080}:8080"
    volumes:
      - market-shop-uploads:/opt/market-shop/data/uploads
    networks:
      - market-shop-network
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      # MySQL root 密码，仅用于数据库容器初始化和健康检查。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # 首次启动时自动创建的商城数据库名称。
      MYSQL_DATABASE: ${MARKET_SHOP_DB_NAME:-market_shop}
      # 首次启动时自动创建的商城业务数据库用户。
      MYSQL_USER: ${MARKET_SHOP_DB_USER:-market_shop}
      # 商城业务数据库用户密码，必须与应用侧配置保持一致。
      MYSQL_PASSWORD: ${MARKET_SHOP_DB_PASSWORD:?MARKET_SHOP_DB_PASSWORD is required}
      # MySQL 容器时区，确保业务时间与香港时区一致。
      TZ: Asia/Hong_Kong
    # 生产基础编排不发布数据库端口；开发覆盖仅绑定 127.0.0.1。
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - market-shop-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # 启用 AOF 持久化，并要求所有客户端使用 .env 中配置的密码。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MARKET_SHOP_REDIS_PASSWORD:?MARKET_SHOP_REDIS_PASSWORD is required}"]
    # 生产基础编排不发布 Redis 端口。
    volumes:
      - redis-data:/data
    networks:
      - market-shop-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$MARKET_SHOP_REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      # Redis 服务密码，同时供启动命令与健康检查读取。
      MARKET_SHOP_REDIS_PASSWORD: ${MARKET_SHOP_REDIS_PASSWORD:?MARKET_SHOP_REDIS_PASSWORD is required}
      MARKET_SHOP_REDIS_DATABASE: ${MARKET_SHOP_REDIS_DATABASE:-0}

  rustfs-permissions:
    image: alpine:3.22
    profiles: ["rustfs"]
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data
    networks:
      - market-shop-network
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    profiles: ["rustfs"]
    restart: unless-stopped
    command: ["/data"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      # RustFS S3 API 在容器内监听的地址和端口。
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # RustFS 管理控制台在容器内监听的地址和端口。
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # 是否启用 RustFS 管理控制台。
      RUSTFS_CONSOLE_ENABLE: "true"
      # RustFS 管理及 S3 API 使用的 Access Key。
      RUSTFS_ACCESS_KEY: ${MARKET_SHOP_RUSTFS_ACCESS_KEY:?MARKET_SHOP_RUSTFS_ACCESS_KEY is required}
      # RustFS 管理及 S3 API 使用的 Secret Key，必须通过 .env 配置。
      RUSTFS_SECRET_KEY: ${MARKET_SHOP_RUSTFS_SECRET_KEY:?MARKET_SHOP_RUSTFS_SECRET_KEY is required}
    ports:
      # RustFS S3 API 的宿主机绑定地址和端口。
      - "${MARKET_SHOP_RUSTFS_BIND_HOST:-127.0.0.1}:${MARKET_SHOP_RUSTFS_API_PORT:-9000}:9000"
      # RustFS 管理控制台的宿主机绑定地址和端口。
      - "${MARKET_SHOP_RUSTFS_BIND_HOST:-127.0.0.1}:${MARKET_SHOP_RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks:
      market-shop-network:
        aliases:
          - rustfs.localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql-data:
  redis-data:
  market-shop-uploads:
  rustfs-data:

networks:
  market-shop-network:
    driver: bridge
