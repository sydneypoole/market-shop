# 仅用于业务验收的覆盖层。必须与生产基础编排和 docker-compose.local.yml
# 一起使用；此处会显式启用测试身份和快速 Outbox 重试，禁止用于正式发布。
services:
  app:
    environment:
      MARKET_SHOP_BOOTSTRAP_ADMIN_ENABLED: "true"
      MARKET_SHOP_BOOTSTRAP_ADMIN_USERNAME: ${MARKET_SHOP_E2E_ADMIN_USERNAME:-admin}
      MARKET_SHOP_BOOTSTRAP_ADMIN_PASSWORD: ${MARKET_SHOP_E2E_ADMIN_TEMP_PASSWORD:-E2eBootstrapTemp2026Strong}
      MARKET_SHOP_BOOTSTRAP_INVITE_CODE: ${MARKET_SHOP_E2E_INVITE_CODE:-E2EBOOTSTRAP2026}
      MARKET_SHOP_BOOTSTRAP_SPONSOR_CLAIM_SECRET: ${MARKET_SHOP_E2E_SPONSOR_CLAIM_SECRET:-E2eSponsorClaimSecret2026StrongFixture}
      MARKET_SHOP_WECHAT_MOCK_ENABLED: "true"
      MARKET_SHOP_SCHEDULING_ENABLED: "true"
      # 行锁闸门用于确定性验证规则切换；较慢的轮询节奏只为让测试日志和
      # 查询负载保持可预测。
      MARKET_SHOP_JOBS_OUTBOX_DELAY_MS: "5000"
      MARKET_SHOP_JOBS_OUTBOX_MAX_ATTEMPTS: "2"
      MARKET_SHOP_JOBS_OUTBOX_BASE_DELAY_SECONDS: "1"
      MARKET_SHOP_JOBS_OUTBOX_MAX_DELAY_SECONDS: "1"
      MARKET_SHOP_SIGNED_URL_SECONDS: "8"
