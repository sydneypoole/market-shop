name: Build and publish Docker image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      run_runtime_e2e:
        description: '额外运行空库、业务闭环和 RustFS 容器验收'
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject whitespace errors in the delivered change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
            # Pushes have no pull-request range; check exactly the delivered
            # commit against its first parent with the same diff contract.
            git diff --check "${HEAD_SHA}^" "${HEAD_SHA}"
          else
            git diff --check "${HEAD_SHA}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production, local and release Compose contracts
        env:
          MARKET_SHOP_CANDIDATE_IMAGE: ghcr.io/example/market-shop@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MARKET_SHOP_RELEASE_DB_NAME: market_shop_preflight
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            --env-file .env.local.example config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml \
            -f docker-compose.e2e.yml --env-file .env.local.example config --quiet
          docker compose -f docker-compose.yml -f docker-compose.release.yml \
            --env-file .env.example --profile release config --quiet

      - name: Validate operational shell scripts
        run: |
          bash -n scripts/*.sh scripts/ops/*.sh
          shellcheck scripts/*.sh scripts/ops/*.sh

      - name: Test WeChat miniprogram static and consumer contracts
        run: pnpm test:miniprogram

      - name: Test web applications and container contract
        run: pnpm test:web && pnpm test:container

      - name: Type-check web applications
        run: pnpm typecheck:web

  runtime-smoke:
    name: Empty database and runtime smoke
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime_e2e == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start a clean local-storage stack
        run: >-
          docker compose --project-name market-shop-e2e-local
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example
          up -d --build --wait --wait-timeout 300 app

      - name: Verify Flyway, admin SPA and core APIs
        env:
          MARKET_SHOP_EXPECT_MINIPROGRAM_MOCK_LOGIN: "true"
        run: bash scripts/runtime-smoke.sh http://127.0.0.1:8080

      - name: Verify cookie sessions and full business lifecycle
        env:
          MARKET_SHOP_E2E_COMPOSE_PROJECT: market-shop-e2e-local
        run: bash scripts/business-e2e.sh http://127.0.0.1:8080 full

      - name: Verify readiness fails closed while liveness stays up
        env:
          MARKET_SHOP_E2E_COMPOSE_PROJECT: market-shop-e2e-local
        run: bash scripts/readiness-drill.sh http://127.0.0.1:8080 redis mysql

      - name: Create a real database and object-volume backup
        id: backup
        env:
          COMPOSE_PROJECT_NAME: market-shop-e2e-local
          MARKET_SHOP_ENV_FILE: .env.local.example
          MARKET_SHOP_COMPOSE_FILES: docker-compose.yml:docker-compose.local.yml:docker-compose.e2e.yml
          MARKET_SHOP_BACKUP_ROOT: ${{ runner.temp }}/market-shop-backups
          BACKUP_REASON: ci-recovery-drill
        run: |
          backup_directory="$(scripts/backup.sh)"
          test -f "${backup_directory}/mysql.sql.gz"
          test -f "${backup_directory}/uploads.tar.gz"
          test -f "${backup_directory}/SHA256SUMS"
          printf 'directory=%s\n' "${backup_directory}" >> "${GITHUB_OUTPUT}"

      - name: Replace the source stack with empty recovery volumes
        run: >-
          docker compose --project-name market-shop-e2e-local
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example down --volumes --remove-orphans

      - name: Generate a production-safe recovery environment
        id: recovery-env
        env:
          RECOVERY_ENV_FILE: ${{ runner.temp }}/market-shop-recovery.env
        run: |
          cat > "${RECOVERY_ENV_FILE}" <<'EOF'
          MYSQL_ROOT_PASSWORD=E2eRecoveryRootPassword2026Strong
          MARKET_SHOP_DB_NAME=market_shop
          MARKET_SHOP_DB_USER=market_shop
          MARKET_SHOP_DB_PASSWORD=E2eRecoveryDatabasePassword2026Strong
          MARKET_SHOP_REDIS_PASSWORD=E2eRecoveryRedisPassword2026Strong
          MARKET_SHOP_REDIS_DATABASE=0
          MARKET_SHOP_IMAGE=market-shop:local
          MARKET_SHOP_HTTP_BIND_HOST=127.0.0.1
          MARKET_SHOP_HTTP_PORT=8080
          SPRING_PROFILES_ACTIVE=prod
          MARKET_SHOP_COOKIE_SECURE=true
          MARKET_SHOP_SCHEDULING_ENABLED=true
          MARKET_SHOP_LOG_ANSI=NEVER
          MARKET_SHOP_LOG_LEVEL=INFO
          MARKET_SHOP_APP_LOG_LEVEL=INFO
          MARKET_SHOP_STORAGE_PROVIDER=local
          MARKET_SHOP_S3_BACKEND_MODE=external
          MARKET_SHOP_STORAGE_CREATE_BUCKET=false
          MARKET_SHOP_LOCAL_STORAGE_ROOT=/opt/market-shop/data/uploads
          MARKET_SHOP_LOCAL_STORAGE_SIGNING_SECRET=E2eRecoveryLocalSigningSecret2026StrongKey
          MARKET_SHOP_LOCAL_STORAGE_PRIVATE_BASE_URL=/api/v1/storage/private
          MARKET_SHOP_RUSTFS_ENDPOINT=https://storage.recovery.company.internal
          MARKET_SHOP_RUSTFS_ACCESS_KEY=e2e-recovery-access
          MARKET_SHOP_RUSTFS_SECRET_KEY=E2eRecoveryRustfsSecret2026StrongKey
          MARKET_SHOP_RUSTFS_BUCKET=market-shop-private
          MARKET_SHOP_RUSTFS_REGION=us-east-1
          MARKET_SHOP_BOOTSTRAP_ADMIN_ENABLED=false
          MARKET_SHOP_BOOTSTRAP_ADMIN_USERNAME=admin
          MARKET_SHOP_BOOTSTRAP_ADMIN_PASSWORD=
          MARKET_SHOP_BOOTSTRAP_INVITE_CODE=
          MARKET_SHOP_BOOTSTRAP_SPONSOR_CLAIM_SECRET=
          MARKET_SHOP_WECHAT_ENABLED=false
          MARKET_SHOP_WECHAT_MOCK_ENABLED=false
          MARKET_SHOP_WECHAT_MINIPROGRAM_APP_ID=
          MARKET_SHOP_WECHAT_MINIPROGRAM_SECRET=
          EOF
          chmod 600 "${RECOVERY_ENV_FILE}"
          printf 'file=%s\n' "${RECOVERY_ENV_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Restore into prod profile and verify Flyway and public smoke
        env:
          COMPOSE_PROJECT_NAME: market-shop-e2e-local
          MARKET_SHOP_ENV_FILE: ${{ steps.recovery-env.outputs.file }}
          MARKET_SHOP_COMPOSE_FILES: docker-compose.yml
          MARKET_SHOP_PUBLIC_URL: http://127.0.0.1:8080
          RESTORE_CONFIRM: YES_RESTORE
          RESTORE_TARGET_STORAGE_PROVIDER: local
        run: scripts/restore.sh "${{ steps.backup.outputs.directory }}"

      - name: Assert restored orders and non-empty private object volume
        env:
          RECOVERY_ENV_FILE: ${{ steps.recovery-env.outputs.file }}
        run: |
          compose=(docker compose --project-name market-shop-e2e-local \
            -f docker-compose.yml --env-file "${RECOVERY_ENV_FILE}")
          summary="$("${compose[@]}" exec -T mysql sh -c \
            'MYSQL_PWD="$MYSQL_PASSWORD" mysql --batch --skip-column-names --raw -u"$MYSQL_USER" "$MYSQL_DATABASE" -e "$1"' \
            sh "SELECT CONCAT((SELECT COUNT(*) FROM trade_order WHERE status = 'COMPLETED'), '|', (SELECT COUNT(*) FROM trade_order_proof WHERE cleaned_at IS NULL));")"
          IFS='|' read -r completed_orders active_proofs <<<"${summary}"
          test "${completed_orders}" -ge 2
          test "${active_proofs}" -ge 1
          object_files="$("${compose[@]}" exec -T app sh -c \
            'find /opt/market-shop/data/uploads -type f ! -name "readiness-*" | wc -l')"
          test "${object_files}" -ge 1
          scripts/production-verify.sh http://127.0.0.1:8080

      - name: Print application diagnostics
        if: failure()
        run: >-
          docker compose --project-name market-shop-e2e-local
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example logs --no-color app mysql redis

      - name: Stop clean stack
        if: always()
        run: >-
          docker compose --project-name market-shop-e2e-local
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example down --volumes --remove-orphans

  rustfs-integration:
    name: RustFS controller E2E
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_runtime_e2e == true }}
    runs-on: ubuntu-latest
    env:
      MARKET_SHOP_STORAGE_PROVIDER: s3
      MARKET_SHOP_S3_BACKEND_MODE: bundled
      MARKET_SHOP_RUSTFS_ENDPOINT: http://rustfs.localhost:9000
      MARKET_SHOP_RUSTFS_ACCESS_KEY: marketshop-local
      MARKET_SHOP_RUSTFS_SECRET_KEY: local_rustfs_secret_with_more_than_32_chars
      MARKET_SHOP_RUSTFS_BUCKET: market-shop-private
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start a clean RustFS-backed application stack
        run: >-
          docker compose --project-name market-shop-e2e-rustfs
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example --profile rustfs
          up -d --build --wait --wait-timeout 300 app

      - name: Verify login, order, multipart upload, signed read and delete through controllers
        env:
          MARKET_SHOP_E2E_COMPOSE_PROJECT: market-shop-e2e-rustfs
        run: bash scripts/business-e2e.sh http://127.0.0.1:8080 storage

      - name: Verify RustFS outage drives object-storage readiness down
        env:
          MARKET_SHOP_E2E_COMPOSE_PROJECT: market-shop-e2e-rustfs
          MARKET_SHOP_E2E_COMPOSE_PROFILES: rustfs
        run: bash scripts/readiness-drill.sh http://127.0.0.1:8080 rustfs

      - name: Print RustFS application diagnostics
        if: failure()
        run: >-
          docker compose --project-name market-shop-e2e-rustfs
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example --profile rustfs logs --no-color rustfs
          app mysql redis

      - name: Stop RustFS-backed stack
        if: always()
        run: >-
          docker compose --project-name market-shop-e2e-rustfs
          -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml
          --env-file .env.local.example --profile rustfs down --volumes --remove-orphans

  image:
    name: Build image
    needs:
      - quality
      - runtime-smoke
      - rustfs-integration
    # Push/PR 默认跳过耗时的容器 E2E，但仍保留 workflow_dispatch
    # 手动验收入口；手动开启时，两个 E2E 任务仍会阻断镜像发布。
    if: >-
      ${{
        !cancelled()
        && needs.quality.result == 'success'
        && (
          (
            github.event_name == 'workflow_dispatch'
            && inputs.run_runtime_e2e == true
            && needs['runtime-smoke'].result == 'success'
            && needs['rustfs-integration'].result == 'success'
          )
          || (
            (github.event_name != 'workflow_dispatch' || inputs.run_runtime_e2e != true)
            && needs['runtime-smoke'].result == 'skipped'
            && needs['rustfs-integration'].result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        id: build
        env:
          # build-push-action 默认会上传 .dockerbuild Artifact，存储配额耗尽时会让镜像已发布的 Workflow 失败。
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=market-shop-image
          cache-to: type=gha,mode=max,scope=market-shop-image
          provenance: mode=max
          sbom: true

      - name: Record immutable image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_reference="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          printf 'Published immutable image: %s\n' "${image_reference}"
          {
            printf '### Published immutable image\n\n'
            printf '`%s`\n' "${image_reference}"
          } >> "${GITHUB_STEP_SUMMARY}"
