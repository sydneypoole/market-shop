name: Build and publish Docker image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test backend
        run: mvn -B -ntp -f backend/pom.xml test

      - name: Test web applications and container contract
        run: pnpm test

      - name: Type-check web applications
        run: pnpm typecheck:web

  runtime-smoke:
    name: Empty database and runtime smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start a clean local-storage stack
        run: docker compose --env-file .env.example up -d --build --wait --wait-timeout 300 app

      - name: Verify Flyway, SPAs and core APIs
        run: bash scripts/runtime-smoke.sh http://127.0.0.1:8080

      - name: Print application diagnostics
        if: failure()
        run: docker compose --env-file .env.example logs --no-color app mysql redis

      - name: Stop clean stack
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  rustfs-integration:
    name: RustFS integration
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start RustFS
        run: docker compose --env-file .env.example --profile rustfs up -d --wait --wait-timeout 180 rustfs

      - name: Upload, presign, download and delete a private object
        env:
          MARKET_SHOP_RUSTFS_INTEGRATION: "true"
          MARKET_SHOP_RUSTFS_ENDPOINT: http://127.0.0.1:9000
          MARKET_SHOP_RUSTFS_ACCESS_KEY: marketshop
          MARKET_SHOP_RUSTFS_SECRET_KEY: change_me_rustfs
          MARKET_SHOP_RUSTFS_BUCKET: market-shop-private
        run: >-
          mvn -B -ntp -f backend/pom.xml
          -pl shop-infrastructure -am
          -Dtest=S3PrivateObjectStorageAdapterIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Print RustFS diagnostics
        if: failure()
        run: docker compose --env-file .env.example --profile rustfs logs --no-color rustfs

      - name: Stop RustFS
        if: always()
        run: docker compose --env-file .env.example --profile rustfs down --volumes --remove-orphans

  image:
    name: Build image
    needs:
      - quality
      - runtime-smoke
      - rustfs-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=market-shop-image
          cache-to: type=gha,mode=max,scope=market-shop-image
          provenance: mode=max
          sbom: true
