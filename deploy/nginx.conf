worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 24m;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_cf_visitor $market_shop_cloudflare_proto {
        default '';
        '~*^\{\s*"scheme"\s*:\s*"https"\s*\}$' https;
        '~*^\{\s*"scheme"\s*:\s*"http"\s*\}$' http;
    }

    map $http_x_forwarded_proto $market_shop_proxy_proto {
        default '';
        ~*^https$ https;
        ~*^http$ http;
    }

    map $market_shop_cloudflare_proto $market_shop_public_proto {
        default $market_shop_proxy_proto;
        https https;
        http http;
    }

    map $market_shop_public_proto $market_shop_forwarded_proto {
        default $scheme;
        https https;
        http http;
    }

    map $market_shop_public_proto $market_shop_forwarded_port_default {
        default $server_port;
        https 443;
        http 80;
    }

    map $http_x_forwarded_port $market_shop_proxy_port {
        default '';
        "~^[0-9]{1,5}$" $http_x_forwarded_port;
    }

    map $market_shop_cloudflare_proto $market_shop_public_port {
        default $market_shop_proxy_port;
        https 443;
        http 80;
    }

    map $market_shop_public_port $market_shop_forwarded_port {
        default $market_shop_forwarded_port_default;
        "~^[0-9]{1,5}$" $market_shop_public_port;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $market_shop_forwarded_port;
    proxy_set_header X-Forwarded-Proto $market_shop_forwarded_proto;
    proxy_set_header Forwarded "proto=$market_shop_forwarded_proto;host=\"$host:$market_shop_forwarded_port\"";
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    upstream market_shop_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /opt/market-shop/web;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/ {
            proxy_pass http://market_shop_backend;
            proxy_read_timeout 60s;
        }

        location /actuator/ {
            proxy_pass http://market_shop_backend;
        }

        location = /docs {
            proxy_pass http://market_shop_backend;
        }

        location /swagger-ui/ {
            proxy_pass http://market_shop_backend;
        }

        location = /api-docs {
            proxy_pass http://market_shop_backend;
        }

        location /api-docs/ {
            proxy_pass http://market_shop_backend;
        }

        location = /admin {
            return 308 /admin/;
        }

        location ^~ /admin/ {
            try_files $uri $uri/ /admin/index.html;
        }

        location ~* ^/assets/.*\.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
